name: Release fs-lazy

on:
  push:
    branches:
      - test/fs-lazy

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build Linux binary
        shell: bash
        env:
          TAG: r42-fs-lazy.1
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 \
            go build -trimpath -ldflags="-s -w -X main.gVersion=$TAG" \
            -o dist/lf-linux-amd64 ./

      - name: Build Windows binary
        shell: bash
        env:
          TAG: r42-fs-lazy.1
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 GOAMD64=v1 \
            go build -trimpath -ldflags="-s -w -X main.gVersion=$TAG" \
            -o dist/lf-windows-amd64.exe ./

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          file dist/lf-linux-amd64 dist/lf-windows-amd64.exe
          ls -lh dist/lf-linux-amd64 dist/lf-windows-amd64.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: r42-fs-lazy.1
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "lf $TAG" \
            --generate-notes \
            dist/lf-linux-amd64 \
            dist/lf-windows-amd64.exe
