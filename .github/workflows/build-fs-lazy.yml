name: Build filesystem-lazy test

on:
  push:
    branches:
      - 'test/fs-lazy'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install helper build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl bzip2 musl-tools

      - name: Build standalone vi
        run: ./scripts/build-vi.sh

      - name: Verify bundled vi is static
        shell: bash
        run: |
          set -euo pipefail
          file internaltools/assets/vi
          if readelf -l internaltools/assets/vi | grep -q 'INTERP'; then
            echo "vi helper must be statically linked" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build Linux binary
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 \
            go build -trimpath -ldflags="-s -w -X main.gVersion=${BRANCH}" \
            -o dist/lf-fs-lazy-linux-amd64 ./
          file dist/lf-fs-lazy-linux-amd64
          ls -lh dist/lf-fs-lazy-linux-amd64

      - name: Build Windows binary
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 GOAMD64=v1 \
            go build -trimpath -ldflags="-s -w -X main.gVersion=${BRANCH}" \
            -o dist/lf-fs-lazy-windows-amd64.exe ./
          file dist/lf-fs-lazy-windows-amd64.exe
          ls -lh dist/lf-fs-lazy-windows-amd64.exe

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: lf-fs-lazy-amd64-v1
          path: |
            dist/lf-fs-lazy-linux-amd64
            dist/lf-fs-lazy-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14
