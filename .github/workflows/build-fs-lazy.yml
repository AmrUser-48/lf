name: Build filesystem-lazy test

on:
  push:
    branches:
      - 'test/fs-lazy-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          variant="${BRANCH##*/}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 \
            go build -trimpath -ldflags="-s -w -X main.gVersion=${BRANCH}" \
            -o "dist/lf-fs-lazy-${variant}" ./
          file "dist/lf-fs-lazy-${variant}"
          ls -lh "dist/lf-fs-lazy-${variant}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: lf-fs-lazy-${{ github.ref_name }}
          path: dist/lf-fs-lazy-*
          if-no-files-found: error
          retention-days: 14
